[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-maker"
version = "1.0.0"
description = "Generate narrated, subtitled vertical short-form videos from a topic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0.0,<3.0.0",
    "moviepy>=2.1.2,<3.0.0",
    "Pillow>=10.4.0,<12.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "numpy>=1.26.4,<3.0.0",
]

[project.scripts]
shorts-maker = "shorts_maker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
